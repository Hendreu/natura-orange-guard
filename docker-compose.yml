services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: natura-secops:latest
    container_name: natura-secops
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://qualys_vis:%242a%2412%24%2FKFqujDMFqhK4b6IvMjQUeJR8YwfcU0Dj6EuYk0XzsP4hWAL1hSmu@10.224.1.244:5432/qualys_db
    ports:
      - "2355:3000"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 3000) + '/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
