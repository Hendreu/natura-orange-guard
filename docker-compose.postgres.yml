services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: natura-secops:latest
    container_name: natura-secops
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-qualys_vis}:${POSTGRES_PASSWORD:-qualys_vis}@postgres:5432/${POSTGRES_DB:-qualys_db}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:' + (process.env.PORT || 3000) + '/').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    container_name: natura-secops-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qualys_db}
      POSTGRES_USER: ${POSTGRES_USER:-qualys_vis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qualys_vis}
      PGUSER: ${POSTGRES_USER:-qualys_vis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-qualys_vis} -d ${POSTGRES_DB:-qualys_db}",
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
